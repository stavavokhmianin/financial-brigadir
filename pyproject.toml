# Общая конфигурация инструментов для Python-частей monorepo.
# Сами пакеты описаны в собственных pyproject.toml:
#   packages/forecast_core, packages/synthetic_generator, services/api

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — норма для проекта
]

[tool.ruff.lint.isort]
known-first-party = ["app", "fb_worker", "financial_sdk", "forecast_core", "synthetic_generator"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"services/api/migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = [
  "packages/forecast_core/tests",
  "packages/financial_sdk/tests",
  "packages/synthetic_generator/tests",
  "services/api/tests",
  "services/worker/tests",
]
addopts = "-q --strict-markers"
markers = [
  "postgres: тест требует реального PostgreSQL (TEST_DATABASE_URL)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.*"]
disallow_untyped_decorators = false
