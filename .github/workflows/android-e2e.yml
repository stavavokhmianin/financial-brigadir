name: Android APK and device E2E

on:
  push:
    branches: [step4ik, master]
    # Эмулятор дорогой по минутам Actions: на push — только при изменении клиента
    # и самой проверки. Изменения API покрывает основной CI, вручную — workflow_dispatch.
    paths:
      - "apps/client/**"
      - ".github/workflows/android-e2e.yml"
      - "scripts/android_e2e.py"
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "Optional prior run with an APK from unchanged client sources"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
  EAS_BUILD_PROFILE: preview
  CI: "1"

jobs:
  # На master тот же коммит обычно уже проверен на step4ik перед слиянием: второй раз
  # дорогую проверку не гоняем. Коммит, который пришёл прямо в master, проверяется полностью.
  # step4ik и ручной запуск проверяются всегда — так две ветки не пропустят друг друга.
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      covered: ${{ steps.check.outputs.covered }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          covered=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_name }}" = master ]; then
            runs="repos/${{ github.repository }}/actions/workflows/android-e2e.yml/runs"
            others=$(gh api "$runs?head_sha=${{ github.sha }}" --jq '[.workflow_runs[]
              | select(.id != ${{ github.run_id }})
              | select(.status != "completed" or .conclusion == "success")] | length')
            if [ "$others" -gt 0 ]; then
              covered=true
              echo "Коммит ${{ github.sha }} уже проверен (или проверяется) на другой ветке."
            fi
          fi
          echo "covered=$covered" >> "$GITHUB_OUTPUT"

  build:
    needs: dedupe
    if: ${{ !inputs.apk_run_id && needs.dedupe.outputs.covered != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Dependencies and native Android project
        working-directory: apps/client
        run: |
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --no-install
      - name: Assemble standalone preview APK (ARM64 and emulator)
        working-directory: apps/client/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon --max-workers=2
      - name: Save installable demo APK
        uses: actions/upload-artifact@v4
        with:
          name: financial-brigadir-preview-apk
          path: apps/client/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  emulator:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.apk_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:////tmp/brigadir-mobile-ci.db
      MAESTRO_VERSION: "1.40.3"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Verify reused APK matches current client sources
        if: ${{ inputs.apk_run_id != '' }}
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          APK_SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" --jq .head_sha)
          git diff --exit-code "$APK_SOURCE_SHA" HEAD -- apps/client ':(exclude)apps/client/.maestro/**'
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: financial-brigadir-preview-apk
          path: artifacts/apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.apk_run_id || github.run_id }}
      - name: Start isolated API with synthetic data
        run: |
          pip install -r requirements-dev.txt
          (cd services/api && alembic upgrade head)
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log > "$RUNNER_TEMP/mobile-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
      - name: Install pinned Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          # Disposable hosted runner: .NET is unused by this Python/Android job.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run MVP on Android 30 (AOSP)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 4096M
          ram-size: 2048M
          cores: 2
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-metrics -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p artifacts/mobile
            adb shell wm size 720x1280
            adb shell wm density 320
            adb install -r artifacts/apk/app-release.apk
            adb reverse tcp:8000 tcp:8000
            python scripts/android_e2e.py
      - name: Save E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence
          path: artifacts/mobile
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
