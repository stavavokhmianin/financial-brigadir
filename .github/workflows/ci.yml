name: CI

on:
  push:
    branches: [step4ik, main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, typecheck, unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brigadir
          POSTGRES_PASSWORD: brigadir
          POSTGRES_DB: brigadir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brigadir"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://brigadir:brigadir@localhost:5432/brigadir_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy packages/forecast_core/src packages/synthetic_generator/src services/api/app services/worker/fb_worker
      - name: Pytest (SQLite + PostgreSQL)
        run: pytest
      - name: Бэктест базового прогноза (раздел 15.2)
        run: python scripts/backtest_baseline.py --seeds 10 --out "$RUNNER_TEMP/backtest.md"

  client:
    name: Client — typecheck, unit, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  compose-smoke:
    name: Docker Compose — сборка и smoke-тест
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (до завершения smoke)
        run: docker compose up --build --abort-on-container-exit --exit-code-from smoke
      - name: Логи при падении
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
