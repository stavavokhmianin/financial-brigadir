# Порт 80 занят nginx панели хостинга, и без этого http:// стенда открывает её заглушку.
# Файл кладётся в vhosts-includes ISPmanager и подключается внутрь её server-блоков, в том
# числе сайта по умолчанию. Свой server-блок не годится: он встал бы раньше и забрал бы
# у панели все запросы с незнакомым Host, включая проверки её сертификатов.
if ($host = STAND_HOST) {
    return 301 https://STAND_HOST$request_uri;
}
