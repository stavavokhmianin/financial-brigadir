# TLS-прокси пилотного контура: статика web-клиента + /api к расчётному API.
# Общий limiter для всех процессов API (лимит в самом API действует на процесс).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=signin:10m rate=6r/m;
limit_req_status 429;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;

    client_max_body_size 3m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Подбор кода участника: не больше 6 попыток в минуту с адреса.
    location = /api/v1/pilot/sessions {
        limit_req zone=signin burst=3 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
