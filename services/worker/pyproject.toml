[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "financial-brigadir-worker"
version = "0.1.0"
description = "Простой фоновой воркер: плановые импорты и пересчёт прогнозов"
requires-python = ">=3.12"
dependencies = ["financial-brigadir-api"]

[tool.hatch.build.targets.wheel]
packages = ["fb_worker"]
