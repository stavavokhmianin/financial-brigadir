[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "financial-brigadir-api"
version = "0.1.0"
description = "Модульный монолит: REST API /api/v1, хранилище, адаптеры источников"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "forecast-core",
  "synthetic-generator",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
