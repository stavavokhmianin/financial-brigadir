[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "financial-sdk"
version = "0.1.0"
description = "Независимый SDK прогнозирования денежных потоков и финансовых рисков"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Financial Brigadir" }]
dependencies = ["forecast-core>=0.1.0,<0.2.0", "tzdata>=2024.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_sdk"]
