          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/imports/csv:
    post:
      tags:
      - imports
      summary: Предпросмотр и импорт CSV-выписки; идемпотентно по fingerprint и Idempotency-Key
      operationId: importCsv
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          description: Повтор запроса с тем же ключом вернёт тот же результат
          title: Idempotency-Key
        description: Повтор запроса с тем же ключом вернёт тот же результат
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_importCsv'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultOut'
        '200':
          description: Предпросмотр или повтор импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultOut'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
