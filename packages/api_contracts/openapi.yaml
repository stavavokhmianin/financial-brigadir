# Сгенерировано services/api/scripts/export_openapi.py — не редактировать вручную.
openapi: 3.1.0
info:
  title: Financial Brigadir API
  description: '

    Расчётный API «Финансового бригадира».


    * Все деньги — целые копейки (`*_minor`, int64), валюта MVP — RUB.

    * Время хранится в UTC, пользовательские даты считаются в таймзоне профиля.

    * `user_id` определяется по токену сессии и никогда не передаётся клиентом.

    * Прогнозы — модельные оценки, а не гарантированный остаток.

    '
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: 'Liveness: процесс API отвечает'
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: 'Readiness: API готово обслуживать запросы (доступна БД)'
      operationId: getReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/demo/profiles:
    get:
      tags:
      - demo
      summary: Демо-профили для экрана запуска
      operationId: listDemoProfiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DemoProfileOut'
                type: array
                title: Response Listdemoprofiles
  /api/v1/demo/sessions:
    post:
      tags:
      - demo
      summary: Создать изолированный профиль из seed (FR-01)
      operationId: createDemoSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionOut'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts:
    get:
      tags:
      - accounts
      summary: Счета пользователя, свободные средства и свежесть источников
      operationId: listAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
    post:
      tags:
      - accounts
      summary: Ручное создание счёта и стартового остатка (FR-03)
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/accounts/{account_id}:
    patch:
      tags:
      - accounts
      summary: Обновить остаток или название счёта вручную
      operationId: updateAccount
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transactions:
    get:
      tags:
      - transactions
      summary: 'Операции: фильтрация и курсорная пагинация (новые сверху)'
      operationId: listTransactions
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Id
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TxType'
          - type: 'null'
          title: Type
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TxStatus'
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsPage'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/obligations:
