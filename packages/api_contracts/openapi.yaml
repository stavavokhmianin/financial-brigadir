components:
  schemas:
    AccountCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        type:
          $ref: '#/components/schemas/AccountType'
        available_balance_minor:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: -9.223372036854776e+18
          title: Available Balance Minor
          examples:
          - 1200000
        currency:
          type: string
          const: RUB
          title: Currency
          default: RUB
        bank_name:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Bank Name
        credit_limit_minor:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 0.0
            examples:
            - 500000
          - type: 'null'
          title: Credit Limit Minor
        is_liquid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Liquid
          description: По умолчанию false для кредитной карты и вклада
      type: object
      required:
      - name
      - type
      - available_balance_minor
      title: AccountCreate
    AccountOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        bank_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bank Name
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          const: RUB
          title: Currency
        available_balance_minor:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: -9.223372036854776e+18
          title: Available Balance Minor
          description: Для кредитной карты отрицательное значение — долг
          examples:
          - 1200000
        credit_limit_minor:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 0.0
            examples:
            - 500000
          - type: 'null'
          title: Credit Limit Minor
        blocked_minor:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Blocked Minor
          examples:
          - 500000
        is_liquid:
          type: boolean
          title: Is Liquid
          description: Учитывается ли счёт в свободных средствах
        updated_at:
          type: string
          format: date-time
          title: Updated At
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceOut'
          - type: 'null'
      type: object
      required:
      - id
      - name
      - bank_name
      - type
      - currency
      - available_balance_minor
      - credit_limit_minor
      - blocked_minor
      - is_liquid
      - updated_at
      - source
      title: AccountOut
    AccountPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        available_balance_minor:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: -9.223372036854776e+18
            examples:
            - 1200000
          - type: 'null'
          title: Available Balance Minor
        blocked_minor:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 0.0
            examples:
            - 500000
          - type: 'null'
          title: Blocked Minor
        credit_limit_minor:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 0.0
            examples:
            - 500000
          - type: 'null'
          title: Credit Limit Minor
        is_liquid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Liquid
      type: object
      title: AccountPatch
      description: 'Обновление остатка или названия вручную (FR-03): дата актуальности = сейчас.'
    AccountType:
      type: string
      enum:
      - debit
      - credit_card
      - savings
      - deposit
      - cash
      title: AccountType
    AccountsOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AccountOut'
          type: array
          title: Items
        liquid_balance_minor:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: -9.223372036854776e+18
          title: Liquid Balance Minor
          description: 'Свободные собственные средства: без кредитных лимитов, депозитов и блокировок'
          examples:
          - 1200000
        data_quality:
          $ref: '#/components/schemas/DataQuality'
      type: object
      required:
      - items
      - liquid_balance_minor
      - data_quality
      title: AccountsOut
    AlertAction:
      type: string
      enum:
      - send
      - defer
