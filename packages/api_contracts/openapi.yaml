# Сгенерировано services/api/scripts/export_openapi.py — не редактировать вручную.
openapi: 3.1.0
info:
  title: Financial Brigadir API
  description: '

    Расчётный API «Финансового бригадира».


    * Все деньги — целые копейки (`*_minor`, int64), валюта MVP — RUB.

    * Время хранится в UTC, пользовательские даты считаются в таймзоне профиля.

    * `user_id` определяется по токену сессии и никогда не передаётся клиентом.

    * Прогнозы — модельные оценки, а не гарантированный остаток.

    '
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: 'Liveness: процесс API отвечает'
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: 'Readiness: API готово обслуживать запросы (доступна БД)'
      operationId: getReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/meta:
    get:
      tags:
      - health
      summary: 'Режим стенда: демо или пилот'
      operationId: getMeta
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaOut'
  /api/v1/pilot/sessions:
    post:
      tags:
      - pilot
      summary: Вход участника пилота по персональному коду
      operationId: createPilotSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PilotSignIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotSessionOut'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/demo/profiles:
    get:
      tags:
      - demo
      summary: Демо-профили для экрана запуска
      operationId: listDemoProfiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DemoProfileOut'
                type: array
                title: Response Listdemoprofiles
  /api/v1/demo/sessions:
    post:
      tags:
      - demo
      summary: Создать изолированный профиль из seed (FR-01)
      operationId: createDemoSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionOut'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
