                $ref: '#/components/schemas/LiveStateOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/v1/live/resume:
    post:
      tags:
      - live
      summary: Продолжить виртуальное время
      operationId: liveResume
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStateOut'
        '401':
