components:
  schemas:
    AccountCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        type:
          $ref: '#/components/schemas/AccountType'
        available_balance_minor:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: -9.223372036854776e+18
          title: Available Balance Minor
          examples:
          - 1200000
        currency:
