      tags:
      - obligations
      summary: 'Ручное обязательство (FR-03): подтверждено пользователем'
      operationId: createObligation
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          description: Повтор запроса с тем же ключом вернёт то же обязательство
          title: Idempotency-Key
        description: Повтор запроса с тем же ключом вернёт то же обязательство
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationOut'
        '200':
          description: Повтор по Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
