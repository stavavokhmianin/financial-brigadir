          type: boolean
          default: false
          title: Include Canceled
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationsOut'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
