  /api/v1/accounts:
    get:
      tags:
      - accounts
      summary: Счета пользователя, свободные средства и свежесть источников
      operationId: listAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
    post:
      tags:
      - accounts
      summary: Ручное создание счёта и стартового остатка (FR-03)
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
        '401':
          description: Нужна авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/accounts/{account_id}:
    patch:
      tags:
      - accounts
      summary: Обновить остаток или название счёта вручную
      operationId: updateAccount
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
