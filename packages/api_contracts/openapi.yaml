  /api/v1/transactions/{transaction_id}/duplicate-resolution:
    post:
      tags:
      - transactions
      summary: 'Решение пользователя: дубль (исключить из модели) или разные операции'
      operationId: resolveDuplicate
      security:
      - HTTPBearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateResolution'
      responses:
