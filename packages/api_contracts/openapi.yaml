      summary: Прогноз остатка по дням из зафиксированного снимка (уровни 0–1, раздел 23.1)
      operationId: createForecast
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
