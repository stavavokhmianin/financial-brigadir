            maxLength: 80
          - type: 'null'
          description: Повтор запроса с тем же ключом вернёт тот же расчёт
          title: Idempotency-Key
        description: Повтор запроса с тем же ключом вернёт тот же расчёт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastOut'
