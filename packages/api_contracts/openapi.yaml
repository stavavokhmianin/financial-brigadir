              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incomes:
    get:
      tags:
      - incomes
      summary: Ожидаемые поступления и их календарь в окне дат
      operationId: listIncomes
      security:
      - HTTPBearer: []
      parameters:
      - name: date_from
        in: query
