[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "synthetic-generator"
version = "0.1.0"
description = "Воспроизводимые синтетические профили и сценарии для демо и эталонных тестов"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fb-synth = "synthetic_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_generator"]
